name: IaC Security Gates
on: [pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install tools
        run: |
          pip install checkov
          curl -sL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          curl -sL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.54.0/conftest_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz && sudo mv conftest /usr/local/bin/
      - name: tfsec
        run: tfsec .
      - name: Checkov
        run: checkov -d .
      - name: Conftest (OPA policies)
        run: conftest test -p policy/ .
